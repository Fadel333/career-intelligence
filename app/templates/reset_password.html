{% extends "base.html" %}

{% block title %}Reset Password - TalentForge AI{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-6 py-12">
    <div class="glass-card p-8" data-aos="fade-up">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-gradient-to-br from-teal-400 to-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                <i class="fas fa-lock text-2xl text-white"></i>
            </div>
            <h2 class="text-2xl font-bold text-white">Set New Password</h2>
            <p class="text-white/60 text-sm mt-2">Enter your new password below</p>
        </div>
        
        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" class="space-y-4">
            <div>
                <label class="block text-white/80 text-sm font-semibold mb-2">New Password</label>
                <input type="password" name="password" required minlength="8"
                       placeholder="Min 8 characters"
                       class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-white/40 focus:border-teal-400 focus:outline-none focus:ring-2 focus:ring-teal-400/30 transition">
                <p class="text-white/40 text-xs mt-1">Must be at least 8 characters</p>
            </div>
            
            <div>
                <label class="block text-white/80 text-sm font-semibold mb-2">Confirm Password</label>
                <input type="password" name="confirm_password" required
                       placeholder="Confirm your new password"
                       class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-white/40 focus:border-teal-400 focus:outline-none focus:ring-2 focus:ring-teal-400/30 transition">
            </div>
            
            <button type="submit" 
                    class="btn-primary w-full py-3 rounded-xl text-white font-bold text-lg transition transform hover:scale-[1.02]">
                <i class="fas fa-check-circle mr-2"></i> Reset Password
            </button>
        </form>
        
        <div class="text-center mt-6">
            <p class="text-white/60 text-sm">
                <a href="{{ url_for('auth.login') }}" class="text-teal-400 hover:text-teal-300 transition">
                    <i class="fas fa-arrow-left mr-1"></i> Back to Login
                </a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
