{% extends "base.html" %}

{% block title %}Login - FADTECH Labs | Career Intelligence System{% endblock %}

{% block content %}
<!-- Login Form Section -->
<section class="max-w-md mx-auto px-6 py-12">
    <div class="glass-card p-8" data-aos="fade-up">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-br from-teal-400 to-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                <i class="fas fa-sign-in-alt text-2xl text-white"></i>
            </div>
            <h2 class="text-2xl md:text-3xl font-bold text-white mb-2">Welcome Back</h2>
            <p class="text-white/60">Sign in to access your career dashboard</p>
        </div>

        <!-- Login Form -->
        <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-6">
            <!-- Email Field -->
            <div>
                <label class="block text-white/80 text-sm font-semibold mb-2">
                    <i class="fas fa-envelope mr-2 text-teal-400"></i> Email Address
                </label>
                <input type="email" 
                       name="email" 
                       required 
                       placeholder="your@email.com"
                       class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-white/40 focus:border-teal-400 focus:outline-none focus:ring-2 focus:ring-teal-400/30 transition">
            </div>

            <!-- Password Field -->
            <div>
                <label class="block text-white/80 text-sm font-semibold mb-2">
                    <i class="fas fa-lock mr-2 text-teal-400"></i> Password
                </label>
                <input type="password" 
                       name="password" 
                       required 
                       placeholder="••••••••"
                       class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-white/40 focus:border-teal-400 focus:outline-none focus:ring-2 focus:ring-teal-400/30 transition">
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="flex justify-between items-center">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" name="remember" class="w-4 h-4 rounded border-white/20 bg-white/10 text-teal-400 focus:ring-teal-400">
                    <span class="text-white/60 text-sm">Remember me</span>
                </label>
                <a href="#" class="text-teal-400 text-sm hover:text-teal-300 transition">Forgot Password?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" 
                    class="btn-primary w-full py-3 rounded-xl text-white font-bold text-lg transition transform hover:scale-[1.02]">
                <i class="fas fa-arrow-right-to-bracket mr-2"></i> Sign In
            </button>
        </form>

        <!-- Divider -->
        <div class="relative my-8">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-white/10"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-4 bg-transparent text-white/40">or</span>
            </div>
        </div>

        <!-- Social Login Options -->
        <div class="space-y-3">
            <button class="w-full py-3 rounded-xl bg-white/5 border border-white/10 text-white font-medium hover:bg-white/10 transition flex items-center justify-center gap-3">
                <i class="fab fa-google text-red-400"></i> Continue with Google
            </button>
            <button class="w-full py-3 rounded-xl bg-white/5 border border-white/10 text-white font-medium hover:bg-white/10 transition flex items-center justify-center gap-3">
                <i class="fab fa-linkedin text-blue-400"></i> Continue with LinkedIn
            </button>
            <button class="w-full py-3 rounded-xl bg-white/5 border border-white/10 text-white font-medium hover:bg-white/10 transition flex items-center justify-center gap-3">
                <i class="fab fa-github text-gray-400"></i> Continue with GitHub
            </button>
        </div>

        <!-- Sign Up Link -->
        <div class="text-center mt-8">
            <p class="text-white/60">
                Don't have an account? 
                <a href="{{ url_for('auth.register') }}" class="text-teal-400 font-semibold hover:text-teal-300 transition">
                    Create Account <i class="fas fa-arrow-right ml-1"></i>
                </a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
