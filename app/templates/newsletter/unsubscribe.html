{% extends "base.html" %}

{% block title %}Unsubscribe - TalentForge AI{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-4 py-20 text-center">
    <div class="glass-card p-8">
        {% if success %}
        <div class="w-16 h-16 rounded-full bg-green-500/20 flex items-center justify-center mx-auto mb-4">
            <i class="fas fa-check text-2xl text-green-400"></i>
        </div>
        <h1 class="text-2xl font-bold text-white mb-2">Unsubscribed</h1>
        <p class="text-white/60 mb-6">{{ message }}</p>
        <p class="text-white/40 text-sm mb-6">
            You can resubscribe anytime from our homepage.
        </p>
        {% else %}
        <div class="w-16 h-16 rounded-full bg-red-500/20 flex items-center justify-center mx-auto mb-4">
            <i class="fas fa-exclamation text-2xl text-red-400"></i>
        </div>
        <h1 class="text-2xl font-bold text-white mb-2">Something went wrong</h1>
        <p class="text-white/60 mb-6">{{ message }}</p>
        {% endif %}
        <a href="{{ url_for('index') }}" class="btn-primary inline-flex items-center gap-2 px-6 py-3 rounded-full">
            <i class="fas fa-home"></i> Back to Home
        </a>
    </div>
</div>
{% endblock %}
