{% extends "base.html" %}

{% block title %}Apply - {{ job.title }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
    <div class="flex items-center gap-4 mb-8">
        <a href="{{ url_for('jobs.job_detail', job_id=job.id) }}" class="text-white/60 hover:text-white transition">
            <i class="fas fa-arrow-left"></i>
        </a>
        <div>
            <h1 class="text-3xl font-bold text-white">📝 Apply for</h1>
            <p class="text-white/60">{{ job.title }}</p>
            <p class="text-white/40 text-sm">{{ job.poster.company_name if job.poster and job.poster.company_name else 'Company' }}</p>
        </div>
    </div>

    <div class="glass-card p-8" data-aos="fade-up">
        <form method="POST" action="{{ url_for('jobs.apply', job_id=job.id) }}" enctype="multipart/form-data" class="space-y-6">
            <!-- Name -->
            <div>
                <label class="text-white font-medium block mb-1">Full Name *</label>
                <input type="text" name="name" required 
                       class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/40 focus:border-teal-400 focus:outline-none transition"
                       placeholder="Your full name"
                       value="{{ current_user.fullname if current_user.is_authenticated else '' }}">
            </div>

            <!-- Email -->
            <div>
                <label class="text-white font-medium block mb-1">Email Address *</label>
                <input type="email" name="email" required 
                       class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/40 focus:border-teal-400 focus:outline-none transition"
                       placeholder="you@example.com"
                       value="{{ current_user.email if current_user.is_authenticated else '' }}">
            </div>

            <!-- Phone -->
            <div>
                <label class="text-white font-medium block mb-1">Phone Number</label>
                <input type="tel" name="phone" 
                       class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/40 focus:border-teal-400 focus:outline-none transition"
                       placeholder="+233 24 123 4567"
                       value="{{ current_user.phone if current_user.is_authenticated else '' }}">
            </div>

            <!-- Cover Letter -->
            <div>
                <label class="text-white font-medium block mb-1">Cover Letter</label>
                <textarea name="cover_letter" rows="6" 
                          class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/40 focus:border-teal-400 focus:outline-none transition"
                          placeholder="Tell us why you're the perfect fit for this role..."></textarea>
            </div>

            <!-- CV Upload -->
            <div>
                <label class="text-white font-medium block mb-1">Upload CV *</label>
                <div class="border-2 border-dashed border-white/20 rounded-xl p-6 text-center hover:border-teal-400/50 transition">
                    <input type="file" name="cv" accept=".pdf,.docx" required 
                           class="w-full text-white/60 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-teal-500/20 file:text-teal-400 hover:file:bg-teal-500/30 cursor-pointer">
                    <p class="text-white/40 text-sm mt-2">Supported formats: PDF, DOCX (Max 10MB)</p>
                </div>
            </div>

            <!-- Submit -->
            <div class="flex gap-4 pt-4">
                <button type="submit" class="flex-1 btn-primary px-8 py-3 rounded-xl text-white font-bold hover:scale-105 transition">
                    <i class="fas fa-paper-plane mr-2"></i> Submit Application
                </button>
                <a href="{{ url_for('jobs.job_detail', job_id=job.id) }}" 
                   class="flex-1 bg-white/10 hover:bg-white/20 rounded-xl px-8 py-3 text-white text-center transition">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
