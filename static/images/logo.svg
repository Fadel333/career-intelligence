<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer glow circles -->
  <circle cx="50" cy="50" r="45" fill="url(#logoGradient)" opacity="0.08" />
  <circle cx="50" cy="50" r="35" fill="url(#logoGradient)" opacity="0.15" />
  <circle cx="50" cy="50" r="25" fill="url(#logoGradient)" opacity="0.25" />
  
  <!-- Main hexagon -->
  <polygon points="50,25 70,35 70,55 50,65 30,55 30,35" fill="none" stroke="url(#logoGradient)" stroke-width="3" />
  
  <!-- Inner hexagon -->
  <polygon points="50,33 62,39 62,51 50,57 38,51 38,39" fill="url(#logoGradient)" opacity="0.6" />
  
  <!-- Nodes at vertices -->
  <circle cx="50" cy="25" r="4.5" fill="#6366f1" />
  <circle cx="70" cy="35" r="4.5" fill="#10b981" />
  <circle cx="70" cy="55" r="4.5" fill="#6366f1" />
  <circle cx="50" cy="65" r="4.5" fill="#10b981" />
  <circle cx="30" cy="55" r="4.5" fill="#6366f1" />
  <circle cx="30" cy="35" r="4.5" fill="#10b981" />
  
  <!-- Center dot -->
  <circle cx="50" cy="45" r="3.5" fill="white" />
  
  <!-- Connection lines (subtle network effect) -->
  <line x1="50" y1="25" x2="50" y2="8" stroke="url(#logoGradient)" stroke-width="1.5" opacity="0.4" />
  <line x1="70" y1="35" x2="88" y2="25" stroke="url(#logoGradient)" stroke-width="1.5" opacity="0.4" />
  <line x1="70" y1="55" x2="88" y2="65" stroke="url(#logoGradient)" stroke-width="1.5" opacity="0.4" />
  <line x1="50" y1="65" x2="50" y2="82" stroke="url(#logoGradient)" stroke-width="1.5" opacity="0.4" />
  <line x1="30" y1="55" x2="12" y2="65" stroke="url(#logoGradient)" stroke-width="1.5" opacity="0.4" />
  <line x1="30" y1="35" x2="12" y2="25" stroke="url(#logoGradient)" stroke-width="1.5" opacity="0.4" />
  
  <!-- Sparkle/innovation dots -->
  <circle cx="84" cy="12" r="2" fill="#6366f1" opacity="0.5" />
  <circle cx="92" cy="22" r="1.5" fill="#10b981" opacity="0.5" />
  <circle cx="8" cy="12" r="2" fill="#10b981" opacity="0.5" />
  <circle cx="16" cy="22" r="1.5" fill="#6366f1" opacity="0.5" />
</svg>